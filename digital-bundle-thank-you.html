<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Bundle Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f7fb;
        color: #151725;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: min(720px, 100%);
        border: 1px solid #e2e6f0;
        border-radius: 8px;
        background: #ffffff;
        padding: clamp(32px, 6vw, 64px);
        text-align: center;
        box-shadow: 0 24px 70px rgba(18, 25, 45, 0.08);
      }
      h1 {
        margin: 0;
        font-size: clamp(34px, 6vw, 64px);
        line-height: 1;
        letter-spacing: -0.04em;
      }
      p {
        color: #707686;
        font-size: 18px;
        line-height: 1.55;
        margin: 20px 0 0;
      }
      a {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 54px;
        margin-top: 28px;
        padding: 0 26px;
        border-radius: 6px;
        background: #312c4f;
        color: #ffffff;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Your Digital Bundle Is Ready</h1>
      <p>
        Your $97 bundle purchase was processed successfully. Check your email for access details
        and keep moving those relationships into paying client conversations.
      </p>
      <a href="/">Return Home</a>
    </main>
    <script>
      const purchase = sessionStorage.getItem("digitalBundlePurchase");
      sessionStorage.removeItem("digitalBundlePurchase");
      if (!purchase) window.location.replace("/");
    </script>
  </body>
</html>
